name: shop_manager
description: Paint & Hardware Shop Manager — a shop management app (not a POS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State management -----------------------------------------------------
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Backend (Supabase) ---------------------------------------------------
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1

  # --- Local cache / offline (Hive) -----------------------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- Routing --------------------------------------------------------------
  go_router: ^14.2.0

  # --- Networking / connectivity --------------------------------------------
  # Pinned below 6.1.0: 6.1.x switched to a jni-based Android impl whose
  # build.gradle is incompatible with the current Gradle/AGP.
  connectivity_plus: ">=6.0.3 <6.1.0"
  http: ^1.2.2

  # --- PDF / printing / sharing ---------------------------------------------
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0

  # --- Media ----------------------------------------------------------------
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # --- Utils ----------------------------------------------------------------
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  local_auth: ^2.3.0
  equatable: ^2.0.5

# Some *_android plugin implementations recently switched to a jni-based
# backend (jni 1.0.1) whose build.gradle is incompatible with the current
# Gradle/AGP. Pin them below those versions until the toolchain catches up.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
